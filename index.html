<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja Registradora - Restaurante</title>
  <link rel="stylesheet" href="estilos.css">
  <!-- Librería Dexie.js para IndexedDB -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>

  <div class="contenedor">
    <h2>🌮 Menú del Restaurante 🍔</h2>

    <form id="formPedido">
      <!-- Plato Principal -->
      <div class="seccion">
        <label for="plato">Plato Principal:</label>
        <select id="plato" required>
          <option value="" disabled selected>Elige un platillo...</option>
          <option value="Tacos de Asada">Tacos de Asada (3 uds) — $6.50</option>
          <option value="Hamburguesa Doble">Hamburguesa Doble Queso — $7.50</option>
          <option value="Burrito Supremo">Burrito Supremo — $8.00</option>
          <option value="Pizza Personal">Pizza Personal Peperoni — $7.00</option>
        </select>
      </div>

      <!-- Tamaño Bebida -->
      <div class="seccion">
        <label>Tamaño de la Bebida:</label>
        <div class="opciones-inline">
          <label><input type="radio" name="bebida" value="pequena" checked> Pequeña ($1.00)</label>
          <label><input type="radio" name="bebida" value="mediana"> Mediana ($1.75)</label>
          <label><input type="radio" name="bebida" value="grande"> Grande ($2.50)</label>
        </div>
      </div>

      <!-- Extras -->
      <div class="seccion">
        <label>¿Deseas agregar extras?</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="extraQueso" value="Extra Queso">
            <label for="extraQueso">🧀 Extra Queso (+$1.50)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="extraGuacamole" value="Guacamole">
            <label for="extraGuacamole">🥑 Guacamole (+$2.00)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="extraPapas" value="Papas Fritas">
            <label for="extraPapas">🥔 Papas Fritas (+$2.50)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="extraHelado" value="Helado Chocolate">
            <label for="extraHelado">🍨 Helado de Chocolate (+$1.80)</label>
          </div>
        </div>
      </div>

      <button type="submit">Calcular Cuenta y Guardar 🛒</button>
    </form>

    <!-- Recibo Digital -->
    <div id="reciboRespuesta"></div>

    <!-- Panel de Administración -->
    <div class="panel-admin">
      <h3>📋 Panel de Administración de Ventas</h3>
      <div class="opciones-inline">
        <button type="button" class="btn-azul" id="btnHistorial">👁 Ver Historial</button>
        <button type="button" class="btn-rojo" id="btnLimpiar">🗑 Limpiar Base de Datos</button>
      </div>
      <div id="tablaHistorial"></div>
    </div>
  </div>

  <script src="programa.js"></script>
</body>
</html>
